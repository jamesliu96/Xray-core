<!DOCTYPE html>
<html>

<head>
	<title>Browser Dialer</title>
	<link rel="icon" href="data:">
</head>

<body>
	<script>
		"use strict";

		const baseWsUrl = `ws://${window.location.host}/websocket?token=csrfToken`;

		function prepareRequestInit(extra) {
			const requestInit = {};
			if (extra.referrer) {
				const referrer = new URL(extra.referrer, window.location.href);
				requestInit.referrer = referrer.pathname + referrer.search + referrer.hash;
				requestInit.referrerPolicy = "unsafe-url";
			}
			if (extra.headers) requestInit.headers = extra.headers;
			if (extra.cookies) requestInit.credentials = 'include';
			return requestInit;
		}

		function setCookiesFromTask(task) {
			if (!task.extra.cookies) return;
			const taskUrl = new URL(task.url);
			for (const [name, value] of Object.entries(task.extra.cookies)) {
				document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; path=${taskUrl.pathname}`;
			}
		}

		function clearCookiesFromTask(task) {
			if (!task.extra.cookies) return;
			const taskUrl = new URL(task.url);
			for (const [name, value] of Object.entries(task.extra.cookies)) {
				document.cookie = `${encodeURIComponent(name)}=; path=${taskUrl.pathname}; Max-Age=0`;
			}
		}

		function executeTask(task) {
			// Connect to the same endpoint but append the taskId to open a data channel
			const ws = new WebSocket(`${baseWsUrl}&taskId=${task.taskId}`);
			ws.binaryType = "arraybuffer";

			ws.onopen = () => {
				if (task.method === "WS") {
					console.log("Dial WS", task.url);
					const wss = new WebSocket(task.url, task.extra.protocol);
					wss.binaryType = "arraybuffer";
					let opened = false;

					ws.onmessage = (e) => wss.send(e.data);
					wss.onopen = () => {
						opened = true;
						ws.send("ok");
					};
					wss.onmessage = (e) => ws.send(e.data);
					wss.onclose = () => ws.close();
					wss.onerror = () => {
						if (!opened) ws.send("fail");
						wss.close();
					};
					ws.onclose = () => wss.close();
				}
				else if (task.method === "GET" && task.streamResponse) {
					(async () => {
						const requestInit = prepareRequestInit(task.extra);
						console.log("Dial GET", task.url);
						ws.send("ok");
						const controller = new AbortController();

						let reader = null;
						ws.onclose = () => {
							if (reader) reader.cancel().catch(() => { });
							controller.abort();
						};

						try {
							requestInit.signal = controller.signal;
							setCookiesFromTask(task);
							const response = await fetch(task.url, requestInit);
							clearCookiesFromTask(task);

							const body = await response.body;
							reader = body.getReader();

							while (true) {
								const { done, value } = await reader.read();
								if (value && value.byteLength > 0) ws.send(value);
								if (done) break;
							}
						} catch (e) {
							console.error("GET stream error", e);
						} finally {
							ws.close();
						}
					})();
				}
				else if (!task.streamResponse) {
					const requestInit = prepareRequestInit(task.extra);
					requestInit.method = task.method;
					console.log("Dial", task.method, task.url);
					ws.send("ok");

					ws.onmessage = async (event) => {
						try {
							if (event.data.byteLength > 0) {
								requestInit.body = event.data;
							}
							setCookiesFromTask(task);
							const response = await fetch(task.url, requestInit);
							clearCookiesFromTask(task);

							if (response.ok) {
								ws.send("ok");
							} else {
								ws.send("fail");
							}
						} catch (e) {
							ws.send("fail");
						} finally {
							ws.close();
						}
					};
				}
			};
			ws.onerror = () => ws.close();
		}

		function connectControlPlane() {
			const controlWs = new WebSocket(baseWsUrl);

			controlWs.onmessage = (event) => {
				const task = JSON.parse(event.data);
				executeTask(task);
			};

			controlWs.onclose = () => {
				// If dropped by Go (because another tab is already primary), retry automatically
				setTimeout(connectControlPlane, 2000);
			};

			controlWs.onerror = () => controlWs.close();
		}

		connectControlPlane();
	</script>
</body>

</html>
